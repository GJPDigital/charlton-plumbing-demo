
media:
  input: images
  output: /images

content:
  - name: homepage
    label: Homepage Content
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero_heading
        label: Hero Heading
        type: string
        required: true

      - name: hero_highlight
        label: Highlighted Heading
        type: string
        required: true

      - name: hero_description
        label: Hero Description
        type: text
        required: true
